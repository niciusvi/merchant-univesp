# Integração contínua: testa em todo push/PR e, se passar, publica a imagem no
# GHCR. A stack do Portainer só usa imagens que vieram daqui (ADR-002):
# nenhum deploy acontece com teste quebrado.
name: Testes e imagem Docker

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  testes:
    runs-on: ubuntu-latest
    env:
      # Só para o settings importar nos testes; não é segredo de nada.
      DJANGO_SECRET_KEY: chave-usada-somente-nos-testes-do-ci-sem-valor-real-0123456789
      DJANGO_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Falha se alguém mudou um modelo sem migração ou criou migrações em conflito.
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 2

  imagem:
    needs: testes
    # PR de fork não tem permissão de escrever pacotes; só push publica.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/merchant-univesp
          # Etiquetas: nome da branch, sha-<commit> (para voltar versão) e latest só na main.
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
